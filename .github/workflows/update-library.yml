name: Weekly library update

# Every Monday, look for newly published open access work and open a pull
# request with one file per item (abstract included, summary to be written).
# Summaries are drafted in the Claude app, not through the paid API. Nothing is
# published until a person reviews each file, sets `reviewed: true`, and merges.
on:
  schedule:
    - cron: '0 14 * * 1' # Mondays, 14:00 UTC
  workflow_dispatch:
    inputs:
      since:
        description: 'Search from this date (YYYY-MM-DD). Leave empty for the last 14 days.'
        required: false
      max_new:
        description: 'Most items to add'
        required: false
        default: '12'

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Find new open access items
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
          SINCE: ${{ inputs.since }}
          MAX_NEW: ${{ inputs.max_new || '12' }}
        run: npm run update-library

      - name: Read the review checklist
        id: report
        run: |
          if [ -f .update-agent-report.md ]; then
            {
              echo 'body<<EOF'
              cat .update-agent-report.md
              echo 'EOF'
            } >> "$GITHUB_OUTPUT"
            rm .update-agent-report.md
          fi

      - name: Open a pull request for review
        uses: peter-evans/create-pull-request@v8
        with:
          branch: library-update
          delete-branch: true
          add-paths: content/library/*.md
          commit-message: 'Library update: new draft items for review'
          title: 'Library update: new items to review'
          body: ${{ steps.report.outputs.body }}
          labels: library-update
